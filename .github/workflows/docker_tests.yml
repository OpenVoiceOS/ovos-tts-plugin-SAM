name: Run Docker Build Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  docker_build_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: docker-practice/actions-setup-docker@master
      - run: |
          sudo docker build . -t ovosttsserver
